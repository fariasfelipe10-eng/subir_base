name: Automação Diária do Supabase

on:
  schedule:
    # Roda automaticamente todos os dias às 03:00 da manhã (horário UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  executar-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências (se necessário)
        run: npm install node-fetch || true

      - name: Rodar Script 1 - Backfill Geral
        run: node backfill.js

      - name: Rodar Script 2 - Atualização de Estatísticas e Gols Pendentes
        run: node backfill_stats.js.js
